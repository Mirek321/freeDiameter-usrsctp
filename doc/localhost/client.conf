# Local SCTP client for the server in this directory.
Identity = "client.localhost";
Realm = "localhost";

TLS_Cred = "doc/localhost/certs/localhost.pem", "doc/localhost/certs/localhost.key";
TLS_CA = "doc/localhost/certs/localhost.pem";

No_TCP;
No_IPv6;
SecPort = 0;
ListenOn = "127.0.0.1";
Port = 3869;
SCTP_UDP_Port = 9900;

LoadExtension = "build-usrsctp/extensions/test_app.fdx" : "doc/localhost/client-test_app.conf";

ConnectPeer = "server.localhost" {
    ConnectTo = "127.0.0.1";
    Port = 3868;
    SCTP_UDP_Port = 9899;
    No_TCP;
    No_TLS;
    No_IPv6;
    Realm = "localhost";
};
