# Local SCTP listener for the localhost client in this directory.
Identity = "server.localhost";
Realm = "localhost";

TLS_Cred = "doc/localhost/certs/localhost.pem", "doc/localhost/certs/localhost.key";
TLS_CA = "doc/localhost/certs/localhost.pem";

No_TCP;
No_IPv6;
SecPort = 0;
ListenOn = "127.0.0.1";
Port = 3868;
SCTP_UDP_Port = 9899;

LoadExtension = "build-usrsctp/extensions/test_app.fdx" : "doc/localhost/server-test_app.conf";

# Trust and maintain the localhost client peer.
ConnectPeer = "client.localhost" {
    ConnectTo = "127.0.0.1";
    Port = 3869;
    SCTP_UDP_Port = 9900;
    No_TCP;
    No_TLS;
    No_IPv6;
    Realm = "localhost";
};
